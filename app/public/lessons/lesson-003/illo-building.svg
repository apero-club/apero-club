<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="A Paris apartment building">
  <!-- Lesson 3 hero tile: a Paris apartment building, flat brand colours. Transparent background. -->
  <!-- chimneys and mansard roof -->
  <g fill="#2913A6">
    <rect x="60" y="14" width="11" height="18" rx="2"/>
    <rect x="130" y="16" width="11" height="16" rx="2"/>
    <path d="M42 58 L58 26 H142 L158 58 Z"/>
  </g>
  <!-- dormer windows -->
  <g fill="#F0A4EB">
    <path d="M70 52 V42 A8 8 0 0 1 86 42 V52 Z"/>
    <path d="M114 52 V42 A8 8 0 0 1 130 42 V52 Z"/>
  </g>
  <!-- façade and cornice -->
  <rect x="46" y="56" width="108" height="136" fill="#3A1FD4"/>
  <rect x="40" y="54" width="120" height="7" rx="3.5" fill="#F0A4EB"/>
  <!-- three floors of tall arched windows -->
  <g fill="#FFFFFF">
    <path d="M60 92 V76 A8 8 0 0 1 76 76 V92 Z"/><path d="M92 92 V76 A8 8 0 0 1 108 76 V92 Z"/><path d="M124 92 V76 A8 8 0 0 1 140 76 V92 Z"/>
    <path d="M60 124 V108 A8 8 0 0 1 76 108 V124 Z"/><path d="M92 124 V108 A8 8 0 0 1 108 108 V124 Z"/><path d="M124 124 V108 A8 8 0 0 1 140 108 V124 Z"/>
    <path d="M60 156 V140 A8 8 0 0 1 76 140 V156 Z"/><path d="M92 156 V140 A8 8 0 0 1 108 140 V156 Z"/><path d="M124 156 V140 A8 8 0 0 1 140 140 V156 Z"/>
  </g>
  <!-- balconies -->
  <g fill="#F0A4EB">
    <rect x="54" y="92" width="92" height="4" rx="2"/>
    <rect x="54" y="124" width="92" height="4" rx="2"/>
    <rect x="54" y="156" width="92" height="4" rx="2"/>
  </g>
  <!-- ground floor: the big front door -->
  <path d="M86 192 V178 A14 14 0 0 1 114 178 V192 Z" fill="#FF5A1F"/>
</svg>
