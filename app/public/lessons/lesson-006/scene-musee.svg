<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="A museum gallery at night">
  <!-- Placeholder drawing for lesson 6 (flat brand colours). Replace with illustrator artwork of the same name. -->
  <rect width="600" height="600" fill="#160A5C"/>
  <!-- tall window with the moon -->
  <rect x="440" y="60" width="110" height="200" rx="55" fill="#2913A6"/>
  <circle cx="495" cy="130" r="26" fill="#FFF0CC"/>
  <rect x="492" y="60" width="6" height="200" fill="#160A5C"/><rect x="440" y="160" width="110" height="6" fill="#160A5C"/>
  <!-- moonlight on the floor -->
  <path d="M440 600 L500 420 L560 420 L600 600 Z" fill="#2913A6"/>
  <!-- the empty frame on the wall -->
  <rect x="130" y="80" width="200" height="250" rx="12" fill="#F29A00"/>
  <rect x="146" y="96" width="168" height="218" rx="6" fill="#FFCF66"/>
  <rect x="162" y="112" width="136" height="186" rx="4" fill="#0A0638"/>
  <rect x="200" y="250" width="60" height="12" rx="6" fill="#5C1D58"/><rect x="206" y="214" width="48" height="40" rx="10" fill="#5C1D58"/>
  <!-- security camera in the corner -->
  <rect x="40" y="40" width="10" height="30" fill="#6C6773"/>
  <rect x="30" y="66" width="50" height="24" rx="6" fill="#A9A4AE"/><circle cx="76" cy="78" r="6" fill="#FF5A1F"/>
  <!-- sculpture on a plinth -->
  <rect x="40" y="430" width="80" height="140" fill="#CBC5B9"/>
  <circle cx="80" cy="360" r="28" fill="#ECE9E3"/>
  <path d="M52 430 C52 390 108 390 108 430 Z" fill="#ECE9E3"/>
  <!-- the visitors' armchair, turned towards the window -->
  <g transform="rotate(-18 300 470)">
    <path d="M250 470 V420 C250 392 350 392 350 420 V470 Z" fill="#3A1FD4"/>
    <rect x="240" y="460" width="120" height="36" rx="14" fill="#3A1FD4"/>
    <rect x="232" y="446" width="24" height="58" rx="12" fill="#2913A6"/><rect x="344" y="446" width="24" height="58" rx="12" fill="#2913A6"/>
    <g fill="#B57200"><rect x="248" y="500" width="10" height="36" rx="4"/><rect x="342" y="500" width="10" height="36" rx="4"/></g>
  </g>
  <!-- the guard's torch beam and a long shadow -->
  <path d="M0 560 L260 470 L270 500 L0 600 Z" fill="#FFF0CC" opacity="0.25"/>
  <ellipse cx="360" cy="560" rx="120" ry="14" fill="#0A0638" opacity="0.6"/>
  <!-- parquet line -->
  <rect y="540" width="600" height="4" fill="#2913A6"/>
</svg>
