<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="The Eiffel Tower disappearing into fog">
  <!-- Lesson 2 hero tile: the tower in fog, in flat brand colours. Transparent background, so it works on any tile colour. Everything stays inside the frame. -->
  <!-- tower (ultramarine), built bottom to top -->
  <g fill="#3A1FD4">
    <!-- legs, with the arch between them -->
    <path d="M66 126 H134 C136 152 148 172 166 192 H136 C130 172 118 158 100 155 C82 158 70 172 64 192 H34 C52 172 64 152 66 126 Z"/>
    <rect x="58" y="116" width="84" height="11" rx="4"/>
    <!-- middle section -->
    <path d="M86 80 H114 C115 96 119 107 127 117 H73 C81 107 85 96 86 80 Z"/>
    <rect x="77" y="72" width="46" height="9" rx="4"/>
    <!-- top section and antenna -->
    <path d="M95 28 H105 C105 46 107 61 112 73 H88 C93 61 95 46 95 28 Z"/>
    <rect x="91" y="22" width="18" height="7" rx="3"/>
    <rect x="98" y="6" width="4" height="18" rx="2"/>
  </g>
  <!-- lattice detail (lilac) -->
  <g stroke="#F0A4EB" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M91 88 L109 106 M109 88 L91 106"/>
    <path d="M97.5 38 L102.5 50 M102.5 38 L97.5 50"/>
    <path d="M78 136 L94 148 M122 136 L106 148"/>
  </g>
  <!-- fog: three soft clouds, the lowest swallowing the legs -->
  <g fill="#FFFFFF">
    <g opacity="0.92">
      <rect x="108" y="52" width="72" height="18" rx="9"/>
      <circle cx="132" cy="52" r="11"/>
      <circle cx="152" cy="50" r="9"/>
    </g>
    <g opacity="0.95">
      <rect x="14" y="132" width="98" height="22" rx="11"/>
      <circle cx="42" cy="132" r="13"/>
      <circle cx="68" cy="128" r="15"/>
      <circle cx="90" cy="134" r="10"/>
    </g>
    <g>
      <rect x="62" y="166" width="124" height="26" rx="13"/>
      <circle cx="96" cy="166" r="16"/>
      <circle cx="126" cy="160" r="19"/>
      <circle cx="156" cy="168" r="13"/>
    </g>
  </g>
</svg>
