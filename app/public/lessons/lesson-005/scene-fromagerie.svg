    <path d="M60 456 L130 432 L150 456 Z" fill="#FFCF66"/>
    <circle cx="200" cy="448" r="14" fill="#FFFFFF"/><circle cx="232" cy="448" r="14" fill="#FFFFFF"/>
    <rect x="270" y="436" width="80" height="22" rx="11" fill="#F29A00"/>
    <path d="M380 456 C380 436 430 436 430 456 Z" fill="#FFF0CC"/>
    <rect x="460" y="440" width="70" height="18" rx="9" fill="#9D8FFF"/>
