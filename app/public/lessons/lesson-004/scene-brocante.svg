<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="A cluttered brocante stall on a sunny Sunday morning">
  <!-- Placeholder drawing for lesson 4 (flat brand colours). Replace with illustrator artwork of the same name. -->
  <rect width="600" height="600" fill="#ADD1F1"/>
  <circle cx="510" cy="90" r="46" fill="#FFCF66"/>
  <!-- trees and buildings on the square -->
  <rect x="0" y="210" width="600" height="390" fill="#DFDBD2"/>
  <rect y="470" width="600" height="130" fill="#CBC5B9"/>
  <g fill="#CBC5B9"><rect x="30" y="230" width="60" height="26" rx="4"/><rect x="130" y="230" width="60" height="26" rx="4"/><rect x="410" y="230" width="60" height="26" rx="4"/><rect x="510" y="230" width="60" height="26" rx="4"/></g>
  <g fill="#2FAE68"><circle cx="70" cy="200" r="58"/><circle cx="530" cy="196" r="62"/></g>
  <!-- the stall's striped awning -->
  <rect x="60" y="150" width="480" height="18" rx="9" fill="#3A1FD4"/>
  <g fill="#FF5A1F"><rect x="60" y="168" width="60" height="44"/><rect x="180" y="168" width="60" height="44"/><rect x="300" y="168" width="60" height="44"/><rect x="420" y="168" width="60" height="44"/></g>
  <g fill="#FFFFFF"><rect x="120" y="168" width="60" height="44"/><rect x="240" y="168" width="60" height="44"/><rect x="360" y="168" width="60" height="44"/><rect x="480" y="168" width="60" height="44"/></g>
  <g fill="#3A1FD4"><rect x="72" y="212" width="10" height="230"/><rect x="518" y="212" width="10" height="230"/></g>
  <!-- gilded mirror leaning at the back -->
  <ellipse cx="420" cy="320" rx="56" ry="78" fill="#F29A00"/>
  <ellipse cx="420" cy="320" rx="42" ry="64" fill="#ADD1F1"/>
  <path d="M398 296 L428 266 M396 318 L440 274" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <!-- two mismatched lamps -->
  <rect x="128" y="300" width="8" height="70" fill="#121014"/><path d="M100 300 L164 300 L150 254 L114 254 Z" fill="#FF7ADB"/>
  <rect x="190" y="330" width="40" height="40" rx="20" fill="#2FAE68"/><rect x="206" y="300" width="8" height="34" fill="#121014"/><path d="M186 302 L234 302 L228 270 L192 270 Z" fill="#FFF0CC"/>
  <!-- table and cloth -->
  <rect x="50" y="440" width="500" height="20" rx="6" fill="#B57200"/>
  <g fill="#B57200"><rect x="70" y="460" width="12" height="110"/><rect x="518" y="460" width="12" height="110"/></g>
  <rect x="50" y="440" width="500" height="50" fill="#F0A4EB"/>
  <g fill="#C463BE"><rect x="90" y="440" width="18" height="50"/><rect x="190" y="440" width="18" height="50"/><rect x="290" y="440" width="18" height="50"/><rect x="390" y="440" width="18" height="50"/><rect x="490" y="440" width="18" height="50"/></g>
  <!-- on the table: radio, records, teapot, postcards -->
  <rect x="80" y="380" width="110" height="62" rx="10" fill="#C93C07"/><circle cx="112" cy="411" r="18" fill="#FFE3D5"/><rect x="140" y="396" width="38" height="8" rx="4" fill="#FFCF66"/><rect x="140" y="414" width="38" height="8" rx="4" fill="#FFCF66"/>
  <g fill="#121014"><rect x="214" y="398" width="72" height="44" rx="3"/></g><rect x="214" y="392" width="72" height="8" rx="3" fill="#3B3741"/><circle cx="250" cy="420" r="10" fill="#FFCF66"/>
  <path d="M310 442 C304 410 318 392 344 392 C370 392 384 410 378 442 Z" fill="#FFFFFF"/><path d="M378 406 C396 406 398 428 380 430" fill="none" stroke="#FFFFFF" stroke-width="7"/><path d="M312 410 L296 398" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/><rect x="336" y="382" width="16" height="12" rx="4" fill="#FFFFFF"/><path d="M356 392 L364 404 L370 394 Z" fill="#ADD1F1"/>
  <rect x="404" y="410" width="80" height="32" rx="4" fill="#B57200"/><g fill="#FFFFFF"><rect x="412" y="398" width="24" height="16" rx="2"/><rect x="440" y="396" width="24" height="18" rx="2"/></g><rect x="456" y="400" width="22" height="14" rx="2" fill="#FFF0CC"/>
  <!-- under the table: the little orange ceramic cat -->
  <g transform="translate(300 536)">
    <path d="M-20 34 C-22 14 -12 0 0 0 C12 0 22 14 20 34 Z" fill="#FF5A1F"/>
    <path d="M-14 -4 L-12 -22 L-2 -10 Z M14 -4 L12 -22 L2 -10 Z" fill="#FF5A1F"/>
    <circle cx="0" cy="-6" r="14" fill="#FF5A1F"/>
    <circle cx="-5" cy="-8" r="5" fill="#FFFFFF"/><circle cx="6" cy="-8" r="2.5" fill="#FFFFFF"/>
    <circle cx="-5" cy="-8" r="2" fill="#121014"/><circle cx="6" cy="-8" r="1.2" fill="#121014"/>
    <path d="M10 6 L16 2 L14 10 Z" fill="#B0B0B0" opacity="0"/>
    <path d="M14 -16 L20 -12 L16 -8 Z" fill="#ADD1F1"/>
  </g>
</svg>
