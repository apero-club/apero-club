<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Madame Zara's table with tarot cards, a crystal ball and a black cat">
  <!-- Placeholder drawing for lesson 7 (flat brand colours). Replace with illustrator artwork of the same name. -->
